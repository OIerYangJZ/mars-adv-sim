<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="505" viewBox="0 0 1140 505" role="img" aria-labelledby="title desc">
<title id="title">Communication overhead comparison</title>
<desc id="desc">Three independent bar-chart panels compare a full-mesh baseline with the optimized strategy. Lower values are better.</desc>
<style>
.title{font:600 25px Arial,sans-serif;fill:#172033} .subtitle{font:14px Arial,sans-serif;fill:#526072}
.panel-title{font:600 16px Arial,sans-serif;fill:#172033} .unit,.tick{font:12px Arial,sans-serif;fill:#64748b}
.category{font:12px Arial,sans-serif;fill:#334155} .value{font:600 13px Arial,sans-serif;fill:#172033}
.reduction{font:600 14px Arial,sans-serif;fill:#087e6b} .grid{stroke:#d9e1ea;stroke-width:1} .axis{stroke:#8391a2;stroke-width:1.2}
.baseline{fill:#7b8798} .optimized{fill:#159a86}
</style>
<rect width="1140" height="505" fill="#ffffff"/>
<text x="55" y="48" class="title">Communication overhead comparison</text>
<text x="55" y="75" class="subtitle">Fixed 10-event scenario | application-layer estimate | independent vertical scales</text>
<rect x="760" y="38" width="14" height="14" class="baseline"/><text x="782" y="50" class="subtitle">Full-mesh baseline</text>
<rect x="930" y="38" width="14" height="14" class="optimized"/><text x="952" y="50" class="subtitle">Optimized strategy</text>
<g>
<text x="70" y="118" class="panel-title">Message count</text>
<text x="70" y="138" class="unit">count; lower is better</text>
<line x1="70" y1="400.0" x2="340" y2="400.0" class="grid"/><text x="60" y="404.0" text-anchor="end" class="tick">0</text><line x1="70" y1="285.0" x2="340" y2="285.0" class="grid"/><text x="60" y="289.0" text-anchor="end" class="tick">21</text><line x1="70" y1="170.0" x2="340" y2="170.0" class="grid"/><text x="60" y="174.0" text-anchor="end" class="tick">42</text><line x1="70" y1="400" x2="340" y2="400" class="axis"/>
<rect x="128" y="170.0" width="68" height="230.0" class="baseline"/><text x="162" y="161.0" text-anchor="middle" class="value">42</text><rect x="224" y="367.1" width="68" height="32.9" class="optimized"/><text x="258" y="358.1" text-anchor="middle" class="value">6</text><text x="162" y="430" text-anchor="middle" class="category">Baseline</text>
<text x="258" y="430" text-anchor="middle" class="category">Optimized</text>
<text x="205.0" y="465" text-anchor="middle" class="reduction">Reduction 85.7%</text>
</g><g>
<text x="425" y="118" class="panel-title">Payload size</text>
<text x="425" y="138" class="unit">bytes; lower is better</text>
<line x1="425" y1="400.0" x2="695" y2="400.0" class="grid"/><text x="415" y="404.0" text-anchor="end" class="tick">0</text><line x1="425" y1="285.0" x2="695" y2="285.0" class="grid"/><text x="415" y="289.0" text-anchor="end" class="tick">12106</text><line x1="425" y1="170.0" x2="695" y2="170.0" class="grid"/><text x="415" y="174.0" text-anchor="end" class="tick">24212</text><line x1="425" y1="400" x2="695" y2="400" class="axis"/>
<rect x="483" y="170.0" width="68" height="230.0" class="baseline"/><text x="517" y="161.0" text-anchor="middle" class="value">24,212</text><rect x="579" y="374.7" width="68" height="25.3" class="optimized"/><text x="613" y="365.7" text-anchor="middle" class="value">2,668</text><text x="517" y="430" text-anchor="middle" class="category">Baseline</text>
<text x="613" y="430" text-anchor="middle" class="category">Optimized</text>
<text x="560.0" y="465" text-anchor="middle" class="reduction">Reduction 89.0%</text>
</g><g>
<text x="780" y="118" class="panel-title">Estimated LLM tokens</text>
<text x="780" y="138" class="unit">tokens; lower is better</text>
<line x1="780" y1="400.0" x2="1050" y2="400.0" class="grid"/><text x="770" y="404.0" text-anchor="end" class="tick">0</text><line x1="780" y1="285.0" x2="1050" y2="285.0" class="grid"/><text x="770" y="289.0" text-anchor="end" class="tick">840</text><line x1="780" y1="170.0" x2="1050" y2="170.0" class="grid"/><text x="770" y="174.0" text-anchor="end" class="tick">1681</text><line x1="780" y1="400" x2="1050" y2="400" class="axis"/>
<rect x="838" y="170.0" width="68" height="230.0" class="baseline"/><text x="872" y="161.0" text-anchor="middle" class="value">1,681</text><rect x="934" y="375.2" width="68" height="24.8" class="optimized"/><text x="968" y="366.2" text-anchor="middle" class="value">181</text><text x="872" y="430" text-anchor="middle" class="category">Baseline</text>
<text x="968" y="430" text-anchor="middle" class="category">Optimized</text>
<text x="915.0" y="465" text-anchor="middle" class="reduction">Reduction 89.2%</text>
</g></svg>
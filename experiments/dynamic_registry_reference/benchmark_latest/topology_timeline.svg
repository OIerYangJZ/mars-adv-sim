<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="560" viewBox="0 0 1140 560" role="img" aria-labelledby="title desc">
<title id="title">Topology size over benchmark events</title>
<desc id="desc">Separate panels show all possible full-mesh directed edges and the smaller task-relevant optimized topology. The vertical marker shows coder failure.</desc>
<style>
.title{font:600 25px Arial,sans-serif;fill:#172033} .subtitle{font:14px Arial,sans-serif;fill:#526072}
.panel-title{font:600 16px Arial,sans-serif;fill:#172033} .tick{font:12px Arial,sans-serif;fill:#64748b}
.grid{stroke:#d9e1ea;stroke-width:1} .axis{stroke:#8391a2;stroke-width:1.2} .outage{stroke:#c2413b;stroke-width:1.5;stroke-dasharray:5 4}
.outage-label{font:600 13px Arial,sans-serif;fill:#a33631}
</style>
<rect width="1140" height="560" fill="#ffffff"/>
<text x="55" y="48" class="title">Topology size over benchmark events</text>
<text x="55" y="75" class="subtitle">Directed communication edges; panels use their own readable scales</text>
<g><text x="90" y="138" class="panel-title">Full-mesh baseline</text>
<line x1="90" y1="275.0" x2="1080" y2="275.0" class="grid"/><text x="78" y="279.0" text-anchor="end" class="tick">0</text><line x1="90" y1="215.0" x2="1080" y2="215.0" class="grid"/><text x="78" y="219.0" text-anchor="end" class="tick">15</text><line x1="90" y1="155.0" x2="1080" y2="155.0" class="grid"/><text x="78" y="159.0" text-anchor="end" class="tick">30</text><line x1="90" y1="275" x2="1080" y2="275" class="axis"/>
<polyline points="90.0,155.0 200.0,155.0 310.0,155.0 420.0,155.0 530.0,155.0 640.0,155.0 750.0,195.0 860.0,195.0 970.0,195.0 1080.0,195.0" fill="none" stroke="#7b8798" stroke-width="3"/><circle cx="90.0" cy="155.0" r="4" fill="#7b8798"/><circle cx="200.0" cy="155.0" r="4" fill="#7b8798"/><circle cx="310.0" cy="155.0" r="4" fill="#7b8798"/><circle cx="420.0" cy="155.0" r="4" fill="#7b8798"/><circle cx="530.0" cy="155.0" r="4" fill="#7b8798"/><circle cx="640.0" cy="155.0" r="4" fill="#7b8798"/><circle cx="750.0" cy="195.0" r="4" fill="#7b8798"/><circle cx="860.0" cy="195.0" r="4" fill="#7b8798"/><circle cx="970.0" cy="195.0" r="4" fill="#7b8798"/><circle cx="1080.0" cy="195.0" r="4" fill="#7b8798"/></g>
<g><text x="90" y="338" class="panel-title">Optimized task-relevant topology</text>
<line x1="90" y1="465.0" x2="1080" y2="465.0" class="grid"/><text x="78" y="469.0" text-anchor="end" class="tick">0</text><line x1="90" y1="410.0" x2="1080" y2="410.0" class="grid"/><text x="78" y="414.0" text-anchor="end" class="tick">3</text><line x1="90" y1="355.0" x2="1080" y2="355.0" class="grid"/><text x="78" y="359.0" text-anchor="end" class="tick">6</text><line x1="90" y1="465" x2="1080" y2="465" class="axis"/>
<polyline points="90.0,373.3 200.0,373.3 310.0,373.3 420.0,373.3 530.0,373.3 640.0,373.3 750.0,373.3 860.0,373.3 970.0,373.3 1080.0,373.3" fill="none" stroke="#159a86" stroke-width="3"/><circle cx="90.0" cy="373.3" r="4" fill="#159a86"/><circle cx="200.0" cy="373.3" r="4" fill="#159a86"/><circle cx="310.0" cy="373.3" r="4" fill="#159a86"/><circle cx="420.0" cy="373.3" r="4" fill="#159a86"/><circle cx="530.0" cy="373.3" r="4" fill="#159a86"/><circle cx="640.0" cy="373.3" r="4" fill="#159a86"/><circle cx="750.0" cy="373.3" r="4" fill="#159a86"/><circle cx="860.0" cy="373.3" r="4" fill="#159a86"/><circle cx="970.0" cy="373.3" r="4" fill="#159a86"/><circle cx="1080.0" cy="373.3" r="4" fill="#159a86"/></g>
<text x="585" y="535" text-anchor="middle" class="subtitle">Scenario event</text>
<text x="90.0" y="500" text-anchor="middle" class="tick">E1</text><text x="200.0" y="500" text-anchor="middle" class="tick">E2</text><text x="310.0" y="500" text-anchor="middle" class="tick">E3</text><text x="420.0" y="500" text-anchor="middle" class="tick">E4</text><text x="530.0" y="500" text-anchor="middle" class="tick">E5</text><text x="640.0" y="500" text-anchor="middle" class="tick">E6</text><text x="750.0" y="500" text-anchor="middle" class="tick">E7</text><text x="860.0" y="500" text-anchor="middle" class="tick">E8</text><text x="970.0" y="500" text-anchor="middle" class="tick">E9</text><text x="1080.0" y="500" text-anchor="middle" class="tick">E10</text><rect x="743.0" y="126" width="14" height="340" fill="#e46666" opacity="0.12"/><line x1="750.0" y1="126" x2="750.0" y2="466" class="outage"/><text x="760.0" y="108" class="outage-label">Coder offline</text></svg>
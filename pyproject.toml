[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic-omega"
version = "0.1.0"
description = "MOSAIC-Ω V3: GoalSpec, ToDAG planning, dynamic registry and receiver-conditioned communication core"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "MOSAIC-Ω Team"}]
dependencies = [
  "jsonschema>=4.20,<5",
]

[project.optional-dependencies]
deepseek = ["openai>=1.40"]
mqtt = ["paho-mqtt>=2.0,<3.0"]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
all = [
  "openai>=1.40",
  "paho-mqtt>=2.0,<3.0",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mosaic_omega.schemas" = ["*.json", "*.md"]
"mosaic_omega.goal_planner.todag" = ["*.json", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
